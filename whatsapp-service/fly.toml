app = "treevu-whatsapp"
primary_region = "gru"

[build]

[env]
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "whatsapp_auth"
  destination = "/app/auth"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
