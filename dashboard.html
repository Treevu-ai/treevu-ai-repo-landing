<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard · Treevü</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #f1f5f9; color: #0f172a; min-height: 100vh; }

  /* Auth screen */
  #auth-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: #0f4c81;
  }
  .auth-box {
    background: #fff; border-radius: 12px; padding: 40px; width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .auth-box h1 { font-size: 22px; font-weight: 700; color: #0f4c81; margin-bottom: 8px; }
  .auth-box p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
  .auth-box input {
    width: 100%; padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 14px; margin-bottom: 12px; outline: none;
  }
  .auth-box input:focus { border-color: #0f4c81; }
  .auth-box button {
    width: 100%; padding: 11px; background: #0f4c81; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .auth-box button:hover { background: #0d3d6b; }
  .auth-error { color: #dc2626; font-size: 13px; margin-top: 8px; }

  /* Dashboard */
  #dashboard { display: none; }
  header {
    background: #0f4c81; padding: 0 28px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { color: #fff; font-size: 17px; font-weight: 700; }
  header .meta { color: #93c5fd; font-size: 12px; }
  .refresh-btn {
    background: rgba(255,255,255,0.15); color: #fff; border: none;
    padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .refresh-btn:hover { background: rgba(255,255,255,0.25); }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

  /* Cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card {
    background: #fff; border-radius: 10px; padding: 20px 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;
  }
  .card-label { font-size: 12px; color: #64748b; font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
  .card-value { font-size: 30px; font-weight: 800; color: #0f172a; margin-top: 6px; }
  .card-sub { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  .card.green .card-value { color: #10b981; }
  .card.blue  .card-value { color: #0f4c81; }
  .card.amber .card-value { color: #f59e0b; }

  /* Grid layout */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .grid-3 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  .panel {
    background: #fff; border-radius: 10px; padding: 20px 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;
  }
  .panel h2 { font-size: 14px; font-weight: 600; color: #64748b; margin-bottom: 16px; text-transform: uppercase; letter-spacing: .5px; }

  /* Funnel */
  .funnel-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .funnel-label { width: 96px; font-size: 13px; color: #475569; text-align: right; flex-shrink: 0; }
  .funnel-bar-wrap { flex: 1; background: #f1f5f9; border-radius: 4px; height: 28px; overflow: hidden; }
  .funnel-bar { height: 100%; border-radius: 4px; display: flex; align-items: center; padding-left: 10px;
    font-size: 12px; font-weight: 600; color: #fff; transition: width .5s ease; min-width: 2px; }
  .funnel-count { width: 36px; text-align: right; font-size: 13px; font-weight: 600; color: #334155; flex-shrink: 0; }

  /* Estado colors */
  .c-nuevo       { background: #64748b; }
  .c-contactado  { background: #3b82f6; }
  .c-reunion     { background: #8b5cf6; }
  .c-propuesta   { background: #f59e0b; }
  .c-cerrado     { background: #10b981; }
  .c-descartado  { background: #ef4444; }

  /* Sources */
  .source-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .source-name { flex: 1; font-size: 13px; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .source-bar-wrap { width: 120px; background: #f1f5f9; border-radius: 4px; height: 10px; }
  .source-bar { height: 10px; border-radius: 4px; background: #0f4c81; }
  .source-pct { width: 36px; text-align: right; font-size: 12px; color: #64748b; }

  /* Loading */
  .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: #94a3b8; font-size: 14px; }
  .spinner { width: 20px; height: 20px; border: 2px solid #e2e8f0; border-top-color: #0f4c81; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Auth -->
<div id="auth-screen">
  <div class="auth-box">
    <h1>Treevü Dashboard</h1>
    <p>Ingresa el CRON_SECRET para acceder</p>
    <input type="password" id="secret-input" placeholder="Secret…" autocomplete="off"/>
    <button onclick="authenticate()">Entrar</button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <header>
    <h1>📊 Pipeline · Treevü</h1>
    <div style="display:flex;align-items:center;gap:16px">
      <span class="meta" id="last-updated"></span>
      <button class="refresh-btn" onclick="loadData()">↻ Actualizar</button>
      <button class="refresh-btn" onclick="logout()">Salir</button>
    </div>
  </header>

  <main>
    <div id="content">
      <div class="loading"><div class="spinner"></div>Cargando datos…</div>
    </div>
  </main>
</div>

<script>
const API = '/api/analytics';
let secret = '';
let refreshTimer = null;

function authenticate() {
  const val = document.getElementById('secret-input').value.trim();
  if (!val) return;
  secret = val;
  localStorage.setItem('db_secret', val);
  loadData();
}

function logout() {
  localStorage.removeItem('db_secret');
  secret = '';
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('secret-input').value = '';
}

async function loadData() {
  document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div>Cargando datos…</div>';
  try {
    const res = await fetch(`${API}?secret=${encodeURIComponent(secret)}`);
    if (res.status === 401) {
      document.getElementById('auth-error').textContent = 'Secret incorrecto.';
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
      return;
    }
    const data = await res.json();
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    render(data);
    document.getElementById('last-updated').textContent =
      'Actualizado: ' + new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
    // Auto-refresh cada 5 min
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = setTimeout(loadData, 5 * 60 * 1000);
  } catch (err) {
    document.getElementById('content').innerHTML = `<div class="loading">Error cargando datos: ${err.message}</div>`;
  }
}

function fmt(n) { return (n || 0).toLocaleString('es-PE'); }

function render(d) {
  const f = d.conversionFunnel || {};
  const ESTADO_ORDER = ['Nuevo','Contactado','Reunion','Propuesta','Cerrado','Descartado'];
  const ESTADO_CLASS = {
    Nuevo: 'c-nuevo', Contactado: 'c-contactado', Reunion: 'c-reunion',
    Propuesta: 'c-propuesta', Cerrado: 'c-cerrado', Descartado: 'c-descartado',
  };
  const maxEstado = Math.max(...ESTADO_ORDER.map(e => d.byEstado?.[e] || 0), 1);

  // Funnel rows
  const funnelHtml = ESTADO_ORDER.map(estado => {
    const count = d.byEstado?.[estado] || 0;
    if (!count && estado !== 'Cerrado') return '';
    const pct = Math.round(count / maxEstado * 100);
    const cls = ESTADO_CLASS[estado] || 'c-nuevo';
    return `<div class="funnel-row">
      <div class="funnel-label">${estado}</div>
      <div class="funnel-bar-wrap">
        <div class="funnel-bar ${cls}" style="width:${pct}%">${count > 2 ? count : ''}</div>
      </div>
      <div class="funnel-count">${count}</div>
    </div>`;
  }).join('');

  // Top sources
  const maxSrc = d.topSources?.[0]?.count || 1;
  const sourcesHtml = (d.topSources || []).map(s =>
    `<div class="source-row">
      <div class="source-name">${s.source}</div>
      <div class="source-bar-wrap"><div class="source-bar" style="width:${Math.round(s.count/maxSrc*100)}%"></div></div>
      <div class="source-pct">${s.pct}%</div>
    </div>`
  ).join('');

  // Weekly trend data for chart
  const weeks  = (d.leadsPerWeek || []).slice(-8).map(w => w.week.replace(/\d{4}-/, ''));
  const counts = (d.leadsPerWeek || []).slice(-8).map(w => w.count);

  document.getElementById('content').innerHTML = `
    <!-- Cards -->
    <div class="cards">
      <div class="card blue">
        <div class="card-label">Total leads</div>
        <div class="card-value">${fmt(d.total)}</div>
        <div class="card-sub">+${d.leadsLast7 || 0} últimos 7 días</div>
      </div>
      <div class="card green">
        <div class="card-label">MRR real</div>
        <div class="card-value">S/ ${fmt(d.mrrActual)}</div>
        <div class="card-sub">Contratos activos</div>
      </div>
      <div class="card amber">
        <div class="card-label">MRR potencial</div>
        <div class="card-value">S/ ${fmt(d.mrrPotencial)}</div>
        <div class="card-sub">Pipeline ALTO + cerrados</div>
      </div>
      <div class="card">
        <div class="card-label">Tasa de cierre</div>
        <div class="card-value">${f.tasaConversion || 0}%</div>
        <div class="card-sub">${f.cerrados || 0} cerrados / ${f.total || 0} total</div>
      </div>
      <div class="card">
        <div class="card-label">En cierre</div>
        <div class="card-value">${f.enCierre || 0}</div>
        <div class="card-sub">Reunión + Propuesta + Cerrado</div>
      </div>
      <div class="card">
        <div class="card-label">Score ALTO</div>
        <div class="card-value">${d.byScore?.ALTO || 0}</div>
        <div class="card-sub">🟡 ${d.byScore?.MEDIO || 0} Medio · 🔵 ${d.byScore?.BAJO || 0} Bajo</div>
      </div>
    </div>

    <!-- Funnel + Sources -->
    <div class="grid-3">
      <div class="panel">
        <h2>Pipeline por estado</h2>
        ${funnelHtml || '<div style="color:#94a3b8;font-size:13px">Sin datos</div>'}
      </div>
      <div class="panel">
        <h2>Top canales</h2>
        ${sourcesHtml || '<div style="color:#94a3b8;font-size:13px">Sin datos</div>'}
      </div>
    </div>

    <!-- Score chart + Weekly trend -->
    <div class="grid-2">
      <div class="panel">
        <h2>Tendencia semanal</h2>
        <canvas id="weekChart" height="120"></canvas>
      </div>
      <div class="panel">
        <h2>Distribución de score</h2>
        <canvas id="scoreChart" height="120"></canvas>
      </div>
    </div>
  `;

  // Weekly trend chart
  if (weeks.length) {
    new Chart(document.getElementById('weekChart'), {
      type: 'bar',
      data: {
        labels: weeks,
        datasets: [{ data: counts, backgroundColor: '#0f4c81', borderRadius: 4 }],
      },
      options: {
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
      },
    });
  }

  // Score donut
  const scoreData = [d.byScore?.ALTO || 0, d.byScore?.MEDIO || 0, d.byScore?.BAJO || 0];
  if (scoreData.some(v => v > 0)) {
    new Chart(document.getElementById('scoreChart'), {
      type: 'doughnut',
      data: {
        labels: ['ALTO 🔥', 'MEDIO 🟡', 'BAJO 🔵'],
        datasets: [{ data: scoreData, backgroundColor: ['#ef4444','#f59e0b','#3b82f6'], borderWidth: 0 }],
      },
      options: {
        plugins: { legend: { position: 'bottom', labels: { font: { size: 12 } } } },
        cutout: '65%',
      },
    });
  }
}

// Auto-login si hay secret guardado
window.addEventListener('load', () => {
  const saved = localStorage.getItem('db_secret');
  if (saved) { secret = saved; loadData(); }
});
</script>
</body>
</html>
